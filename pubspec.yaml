name: customs_broker_app
description: دليل المخلص الجمركي اليمني - منصة احترافية لإدارة مكاتب التخليص الجمركي

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Local Database
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Localization / Utils
  intl: ^0.20.2
  uuid: ^4.5.1

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  animated_splash_screen: ^1.3.0
  page_transition: ^2.2.1
  lottie: ^3.3.0

  # Documents / Files
  pdf: ^3.11.1
  printing: ^5.14.0
  excel: ^4.0.6
  file_picker: ^10.3.10

  # Images
  image_picker: ^1.1.2

  # Sharing
  share_plus: ^10.1.4

  # Storage / Security
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4


dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.15

  injectable_generator: ^2.7.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

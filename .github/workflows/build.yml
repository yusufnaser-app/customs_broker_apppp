name: Build & Release APK/AAB

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  build-android:

    name: Build Android App

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@v4


      - name: 🔧 Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: ✅ Flutter Doctor
        run: flutter doctor


      - name: 📦 Get Flutter packages
        run: flutter pub get


      - name: 🔍 Analyze code
        run: flutter analyze || true


      - name: 🧪 Run tests
        run: flutter test || true


      - name: 🔐 Setup Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          if [ -z "$KEYSTORE_BASE64" ]; then

            echo "⚠️ No keystore found. Using debug signing."

          else

            echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d --ignore-garbage > android/app/release.jks
            if [ ! -s android/app/release.jks ]; then
              echo "❌ فشل فك تشفير الـ keystore — تحقق من صحة قيمة KEYSTORE_BASE64 في Secrets."
              exit 1
            fi


            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=release.jks" >> android/key.properties


            echo "✅ Release signing configured."

          fi


      - name: 🏗️ Build APK Release
        run: flutter build apk --release


      - name: 📦 Build AAB Release
        run: flutter build appbundle --release


      - name: 📂 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30


      - name: 📂 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30


      - name: 📊 Build Summary
        run: |

          echo "## ✅ Build Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY
